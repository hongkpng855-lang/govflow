<script>
(function() {
  const emojiMap = {
    "\uD83D\uDCC4":"file-text","\uD83D\uDC63":"footprints","\uD83C\uDD93":"sparkles",
    "\u2615":"coffee","\uD83D\uDE80":"rocket","\u2753":"help-circle",
    "\u26A0\uFE0F":"triangle-alert","\uD83C\uDFAF":"target","\uD83D\uDCA1":"lightbulb",
    "\uD83D\uDCB0":"coins","\uD83C\uDF89":"party-popper","\uD83D\uDCCA":"bar-chart-3",
    "\uD83D\uDCDA":"book-open","\uD83D\uDCDD":"pen-line","\uD83D\uDD0D":"search",
    "\uD83D\uDEE0":"wrench","\uD83D\uDCCB":"clipboard-list","\uD83D\uDCDC":"scroll-text",
    "\uD83D\uDCC2":"folder-open","\uD83D\uDCCE":"paperclip","\uD83C\uDFE2":"building-2",
    "\uD83D\uDCAC":"message-square","\uD83D\uDDA5":"monitor","\uD83D\uDCE7":"mail",
    "\uD83C\uDFE6":"banknote","\uD83D\uDD17":"link","\uD83D\uDE34":"sleep",
    "\uD83D\uDD35":"circle","\uD83D\uDFE2":"circle","\uD83D\uDFE1":"circle",
  };
  function r() {
    let c=0; const w=document.createTreeWalker(document.body,4,null,false);
    let n; while(n=w.nextNode()) {
      if(n.parentElement&&n.parentElement.closest('script,style,svg,code,pre')) continue;
      let t=n.nodeValue||''; let changed=false;
      for(const[e,i]of Object.entries(emojiMap)) {
        if(t.includes(e)) { const s=document.createElement('span'); s.innerHTML=t.split(e).join('<i data-lucide="'+i+'" class="inline-block w-4 h-4"></i>'); while(s.firstChild)n.parentNode.insertBefore(s.firstChild,n); n.parentNode.removeChild(n); c++; break; }
      }
    }
    if(c>0&&typeof lucide!=='undefined') try{lucide.createIcons();}catch(e){}
    return c;
  }
  [300,1000,2500,5000].forEach(function(d){setTimeout(r,d);});
  setTimeout(function(){new MutationObserver(function(){r();}).observe(document.body,{childList:true,subtree:true,characterData:true});},100);
})();
</script>
